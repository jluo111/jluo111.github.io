<section class="surface list-surface">
    <header class="section-head">
        <h2 class="section-title mb-0">{{ include.title | strip_html | strip | default: "Selected Publications" }}</h2>
        <a class="more-link" href="{{ '/publications' | relative_url }}">All publications <i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i></a>
    </header>
    <div class="pub-list">
        {%- for item in include.publications limit: include.limit -%}
        {% include widgets/publication_item.html item=item compact=true %}
        {%- endfor -%}
    </div>
</section>
