<section class="surface card-pad about">
    <h2 class="section-title">About</h2>
    <div class="bio{% if site.data.profile.short_bio_text_justify %} bio--justify{% endif %}">
        {{ site.data.profile.short_bio }}
    </div>
    {%- if site.data.profile.interests -%}
    <p class="interests">
        <span class="interests-label">Research interests</span>
        {%- for interest in site.data.profile.interests -%}<span class="interest">{{ interest }}</span>{%- endfor -%}
    </p>
    {%- endif -%}
    {%- if site.data.profile.cv_link -%}
    <a class="pub-link mt-3" target="_blank" rel="noopener" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fa-regular fa-file-lines" aria-hidden="true"></i>Curriculum Vitae</a>
    {%- endif -%}
</section>
