<nav class="navbar navbar-expand-sm navbar-light fixed-top site-nav" aria-label="Main">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars" aria-hidden="true"></i><i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {%- for item in site.data.navigation.pages -%}
                {%- assign is_current = false -%}
                {%- if item.name == page.navbar_title -%}{%- assign is_current = true -%}{%- endif -%}
                <li class="nav-item{% if is_current %} active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.name }}</a>
                </li>
                {%- endfor -%}
            </ul>
        </div>
    </div>
</nav>
