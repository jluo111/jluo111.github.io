# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# They also feed the blog's Atom feed (/feed.xml) and the <meta name="description"> tag.
title: Jian Luo
author: Jian Luo
url: "https://jluo111.github.io"
baseurl: "" # the subpath of your site, e.g. /blog
description: >-
  Jian Luo — Ph.D. student in Applied Mathematics and Statistics at Stony Brook University,
  working on the post-training and applications of large language models.

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: mathjax            # emits \( \) and \[ \]; rendered in the browser by KaTeX (see _layouts/default.html)
  footnote_backlink: "&#8617;&#xFE0E;"
plugins:
  - jekyll-email-protect
  - jekyll-feed                   # Atom feed of the blog at /feed.xml (whitelisted on GitHub Pages)

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# timezone: Asia/Shanghai

collections:
  - publications
  # - news
  # - showcase

# Blog posts live in _posts/YYYY-MM-DD-slug.md and are served at /blog/YYYY/slug/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      navbar_title: Blog
      permalink: /blog/:year/:title/
